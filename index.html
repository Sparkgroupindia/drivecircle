<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.webmanifest"><title>DriveCircle | Pickup & Drop</title><style>
:root{--bg:#090f1b;--card:#142035;--card2:#1b2b43;--line:#2b3d58;--text:#eaf2ff;--muted:#9eb1c9;--blue:#52a8ff;--green:#45d79a;--red:#ff7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,Arial}a{color:var(--blue)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;background:var(--blue);color:#07101e;border-radius:10px;padding:12px 16px;font-weight:750}button.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}button.danger{background:#753046;color:white}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#0d192b;color:var(--text);outline:none}input:focus{border-color:var(--blue)}label{display:block;margin-bottom:7px;color:var(--muted);font-size:12px}h1,h2,h3,p{margin:0 0 12px}.wrap{max-width:1100px;margin:auto;padding:16px}.hero{display:flex;align-items:center;gap:12px;margin-bottom:20px}.brand{width:47px;height:47px;border-radius:12px;background:#246aba;display:grid;place-items:center;font-size:27px;overflow:hidden}.brand img{width:100%;height:100%;object-fit:contain;background:white}.small{font-size:12px;color:var(--muted)}.card{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{margin-bottom:9px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}.nav button{font-size:12px}.muted{color:var(--muted)}.pill{display:inline-block;border-radius:20px;padding:4px 8px;font-size:11px;background:#273d58}.good{color:var(--green)}.bad{color:var(--red)}.item{padding:13px;border:1px solid var(--line);border-radius:12px;margin:10px 0;background:#0f1b2d}.line{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{padding:9px 11px;font-size:12px}.login{max-width:430px;margin:8vh auto}.hide{display:none!important}.toast{position:fixed;left:16px;right:16px;bottom:15px;max-width:500px;margin:auto;background:#243953;border:1px solid #53779a;border-radius:12px;padding:14px;z-index:10;box-shadow:0 6px 20px #0009;display:none}.stat{font-size:27px;font-weight:800}#map{height:380px;border-radius:12px;overflow:hidden;background:#263c55}.angles{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}.angle{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#0d192b}.angle.done{border-color:var(--green)}.angle input{max-width:100%;font-size:10px;padding:5px}.photo{max-width:100%;max-height:350px;border-radius:10px}.pulse{animation:pulse 1s infinite alternate}@keyframes pulse{to{box-shadow:0 0 0 6px #409cf944}}@media(max-width:600px){.wrap{padding:12px}.card{padding:14px}.hero h1{font-size:19px}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.nav button{padding:10px 5px}}
</style></head><body><div id="app" class="wrap"><div class="card"><h2>DriveCircle</h2><p>Opening login…</p></div></div><div id="toast" class="toast"></div><div id="transport-root" hidden></div><script src="config.js?v=5"></script><script src="transport.js?v=5"></script><script src="app.js?v=5"></script><script>setTimeout(function(){if(!window.__drivecircleMainLoaded){document.getElementById('app').innerHTML='<div class="card"><h2>App JavaScript did not load</h2><p>Check GitHub Pages files: config.js, transport.js, app.js</p></div>'}},3000)</script></body></html>
